name: Validate billing POC
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test reconciliation rules
        run: node tests/engine.test.js
      - name: Verify browser bundle
        run: python tests/check_bundle.py
